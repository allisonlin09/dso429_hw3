name: Answer quiz rounds

# One run polls every 3 minutes for ~5.3 hours (loop.sh), then starts the
# next run itself. GitHub's cron only fired every 2-4 hours here, so it is
# just a backup that restarts the chain if it ever breaks; the concurrency
# group keeps at most one loop running.
on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  actions: write  # to start the next run

concurrency:
  group: answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the Gemini key (test only)
        if: contains(github.event.head_commit.message, '[test-gemini]')
        continue-on-error: true  # a failed test must never block answering
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sSfL -o /tmp/practice_keys.csv https://raw.githubusercontent.com/FaisalXL/dso429-hourly-quiz/main/practice_keys.csv
          set +e
          python answer.py --test-llm /tmp/practice_keys.csv > /tmp/gemini_test.txt 2>&1
          status=$?
          # Annotations are visible without signing in to GitHub.
          while IFS= read -r line; do echo "::notice title=gemini test::$line"; done < <(grep -E "^(r[0-9]|gemini [0-9])" /tmp/gemini_test.txt; echo "503 retries: $(grep -c "HTTP 503" /tmp/gemini_test.txt)")
          exit $status

      - name: Write a sample alert (test only)
        if: contains(github.event.head_commit.message, '[test-alert]')
        run: |
          python -c "import answer; answer.write_alert([{'round_id':'49','q_index':'7','released_at':'2026-10-17T21:00:00Z','question_text':'TEST ALERT - sample question the solver cannot answer','option_a':'1','option_b':'2','option_c':'3','option_d':'4'}])"
          echo "TITLE_PREFIX=[TEST] " >> "$GITHUB_ENV"

      - name: Answer rounds every 3 minutes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          LOOP_MINUTES: "320"
          INTERVAL: "180"
        run: bash loop.sh

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run answer.yml --ref main
