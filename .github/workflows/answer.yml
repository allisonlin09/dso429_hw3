name: Answer quiz rounds

on:
  schedule:
    # GitHub cron is best-effort and can lag by several minutes; running
    # every 15 minutes keeps us well inside the 3-hour full-credit window.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the Gemini key (test only)
        if: contains(github.event.head_commit.message, '[test-gemini]')
        continue-on-error: true  # a failed test must never block answering
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -sSfL -o /tmp/practice_keys.csv https://raw.githubusercontent.com/FaisalXL/dso429-hourly-quiz/main/practice_keys.csv
          set +e
          python answer.py --test-llm /tmp/practice_keys.csv > /tmp/gemini_test.txt 2>&1
          status=$?
          # Annotations are visible without signing in to GitHub.
          while IFS= read -r line; do echo "::notice title=gemini test::$line"; done < /tmp/gemini_test.txt
          exit $status

      - name: Answer new rounds
        id: answer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python answer.py
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add answers; for f in unsolved.log llm_answers.json; do [ -f "$f" ] && git add "$f"; done || true
          if git diff --cached --quiet; then
            echo "No new rounds."
          else
            git commit -m "Answer rounds $(git diff --cached --name-only answers | sed -E 's/.*round-0*([0-9]+).*/\1/' | paste -sd, -)"
            git pull --rebase
            git push
          fi

      - name: Write a sample alert (test only)
        if: contains(github.event.head_commit.message, '[test-alert]')
        run: |
          python -c "import answer; answer.write_alert([{'round_id':'49','q_index':'7','released_at':'2026-10-17T21:00:00Z','question_text':'TEST ALERT - sample question the solver cannot answer','option_a':'1','option_b':'2','option_c':'3','option_d':'4'}])"
          echo "TITLE_PREFIX=[TEST] " >> "$GITHUB_ENV"

      - name: Open a GitHub issue (phone notification)
        if: always() && hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "${TITLE_PREFIX}New question type found - see status inside" --body-file alert.md

      - name: Fail if any question was unsolved
        if: steps.answer.outputs.status != '0'
        run: |
          cat unsolved.log
          exit 1
