name: Answer quiz rounds

on:
  schedule:
    # GitHub cron is best-effort and can lag by several minutes; running
    # every 15 minutes keeps us well inside the 3-hour full-credit window.
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Answer new rounds
        id: answer
        run: |
          set +e
          python answer.py
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add answers unsolved.log 2>/dev/null || git add answers
          if git diff --cached --quiet; then
            echo "No new rounds."
          else
            git commit -m "Answer rounds $(git diff --cached --name-only answers | sed -E 's/.*round-0*([0-9]+).*/\1/' | paste -sd, -)"
            git pull --rebase
            git push
          fi

      - name: Write a sample alert (test only)
        if: contains(github.event.head_commit.message, '[test-alert]')
        run: |
          python -c "import answer; answer.write_alert([{'round_id':'49','q_index':'7','released_at':'2026-10-17T21:00:00Z','question_text':'TEST ALERT - sample question the solver cannot answer','option_a':'1','option_b':'2','option_c':'3','option_d':'4'}])"
          echo "TITLE_PREFIX=[TEST] " >> "$GITHUB_ENV"

      - name: Open a GitHub issue (phone notification)
        if: always() && hashFiles('alert.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "${TITLE_PREFIX}Unsolved quiz question(s) - fix within 3 hours of release" --body-file alert.md

      - name: Fail if any question was unsolved
        if: steps.answer.outputs.status != '0'
        run: |
          cat unsolved.log
          exit 1
